# One entry per development repository.
#
# Repository-owned specifics (validation commands, risk paths, knowledge map)
# live in each repository's .ai-workflow/project.yaml, not here. This file only
# answers "which repository does this Linear issue belong to, where is it, and
# how does its CI actually fire".
#
# `base_branch` was read from each repository's real origin/HEAD, not assumed.
# Inova and hefesto are on `master`.
#
# `ci.trigger` was read from each repository's .github/workflows `on:` blocks:
#   pull_request  a pushed ai/* branch triggers NOTHING. The draft PR must open
#                 first, purely so CI has something to run against.
#   branch_push   CI runs on any branch push; a PR is not needed to get checks.
#   none          no workflows at all. Local validation becomes the authority.
#
# `required_checks` empty means "whatever GitHub reports as required".
#
# Each Linear project maps to exactly one repository, so no `groups` are needed
# and resolution succeeds via `sole_project`.

projects:
  unirv-monolith:
    enabled: true
    repository:
      path: H:/Code/UniRV/unirv-monolith
      github: AgroHub-Uni-RV/unirv-monolith
      base_branch: main
    linear:
      project: AgroHub Monolith
      default: true
    knowledge:
      status: unverified
    routing_profile: default
    validation:
      source: repository
    ci:
      trigger: pull_request
      required_checks: []

  lorebound:
    enabled: true
    repository:
      path: H:/Code/Pessoais/Lorebound
      github: JPClow3/Lorebound
      base_branch: main
    linear:
      project: Lorebound
      default: true
    knowledge:
      status: unverified
    routing_profile: default
    validation:
      source: repository
    ci:
      trigger: pull_request
      required_checks: []

  moto-track:
    enabled: true
    repository:
      path: H:/Code/Pessoais/moto_track
      github: JPClow3/moto_track
      base_branch: main
    linear:
      project: Moto Track
      default: true
    knowledge:
      status: unverified
    routing_profile: default
    validation:
      source: repository
    ci:
      trigger: pull_request
      required_checks: []

  # CI is DORMANT: .github/workflows/build.yml triggers on `branches: [master]`
  # for both push and pull_request, but this repository is on `main`. No check
  # has ever run. Declared `none` so the controller treats local validation as
  # the authority instead of waiting forever for checks that cannot start.
  # Fix the workflow's branch filter to re-enable `pull_request`.
  portfolio:
    enabled: true
    repository:
      path: H:/Code/Pessoais/Portfolio
      github: JPClow3/Portfolio
      base_branch: main
    linear:
      project: Portfolio
      default: true
    knowledge:
      status: unverified
    routing_profile: default
    validation:
      source: repository
    ci:
      trigger: none
      required_checks: []

  # Default branch is master, not main.
  inova:
    enabled: true
    repository:
      path: H:/Code/Freelance/Inova
      github: JPClow3/Inova
      base_branch: master
    linear:
      project: Inova
      default: true
    knowledge:
      status: unverified
    routing_profile: default
    validation:
      source: repository
    ci:
      trigger: pull_request
      required_checks: []

  fatec-web:
    enabled: true
    repository:
      path: H:/Code/Freelance/fatec-web
      github: JPClow3/fatec-web
      base_branch: main
    linear:
      project: FATEC Web
      default: true
    knowledge:
      status: unverified
    routing_profile: default
    validation:
      source: repository
    ci:
      trigger: pull_request
      required_checks: []

  throughline:
    enabled: true
    repository:
      path: H:/Code/Pessoais/Throughline
      github: JPClow3/Throughline
      base_branch: main
    linear:
      project: Throughline
      default: true
    knowledge:
      status: unverified
    routing_profile: default
    validation:
      source: repository
    ci:
      trigger: pull_request
      required_checks: []

  # Python data/model pipeline. Default branch is master, not main.
  # Distinct repository from hefesto-site.
  hefesto:
    enabled: true
    repository:
      path: H:/Code/Pessoais/hefesto
      github: JPClow3/hefesto
      base_branch: master
    linear:
      project: Hefesto Pipeline
      default: true
    knowledge:
      status: unverified
    routing_profile: default
    validation:
      source: repository
    ci:
      trigger: pull_request
      required_checks: []

  # No GitHub Actions workflows at all. With trigger `none` the controller
  # treats local validation as the authority, which is weaker than every other
  # repository here. Disable it, or add a CI workflow, before trusting
  # autonomous PRs from this one.
  hefesto-site:
    enabled: true
    repository:
      path: H:/Code/Pessoais/Hefesto-Site
      github: JPClow3/Hefesto-Site
      base_branch: main
    linear:
      project: Hefesto Site
      default: true
    knowledge:
      status: unverified
    routing_profile: default
    validation:
      source: repository
    ci:
      trigger: none
      required_checks: []

groups: {}
