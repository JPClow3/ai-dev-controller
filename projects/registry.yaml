# One entry per development repository. `ai-dev onboard <path>` appends here.
# Repository-owned specifics (validation commands, risk paths, knowledge map)
# live in each repository's .ai-workflow/project.yaml, not here.

projects: {}

# Multi-repository Linear projects. An issue body or label containing
# `repo:<id>` overrides the group default. If the controller cannot resolve
# exactly one repository it applies `ai-needs-context` rather than guessing.
groups: {}

