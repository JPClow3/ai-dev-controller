limits:
  same_model_repair: 1
  worker_escalations: 2
  review_remediation_cycles: 2
  sol_adjudications: 1

# The classifier says WHAT went wrong. This file says which actions are legal.
# A recommendation outside the listed route is discarded.
failure_routes:
  mechanical:
    - same_model
  localized_logic:
    - cross_family_routine
    - complex_worker
  context_insufficient:
    - large_context
  architecture_integration:
    - orchestrator
    - high_risk
  reviewer_dispute:
    - high_risk
  flaky_environmental:
    - rerun_ci
  requirement_ambiguity:
    - human
  unknown:
    - complex_worker
    - human

# Aliases a given failure class may never reach, regardless of the ladder.
forbidden:
  mechanical:
    - sol_medium
    - sol_high
    - sol_xhigh
  localized_logic:
    - sol_medium
    - sol_high
    - sol_xhigh
  requirement_ambiguity:
    - "*"

# The legacy action name is retained for config compatibility. With every
# worker on OpenAI models it changes model tier or reasoning effort instead
# of switching vendor.
cross_family_preference:
  openai: [luna_xhigh, terra_high, terra_xhigh]

review_remediation:
  orchestrator_validates_finding: true
  remediation_worker: different_from_original_author
  reviewer_rechecks: true
  blocking_severities: [critical, high]

human_escalation_triggers:
  - unresolved_requirement
  - contradictory_authoritative_docs
  - undeclared_dependency_requiring_dag_change
  - retry_budget_exhausted
  - destructive_operation_requested
  - repository_resolution_ambiguous
  - dependency_cycle_detected
