version: 1

# The model diagnoses the failure. The controller decides which actions are legal.
# A classifier verdict outside `failure_classes` is treated as `unknown`.

retry_policy:
  same_model_repair: 1
  worker_escalations: 2
  review_remediation_cycles: 2
  sol_adjudications: 1
  # On exhaustion:
  on_exhausted: BLOCKED_HUMAN

failure_classes:

  mechanical:
    description: >
      Formatter, type error, obvious failed assertion, small build error.
      Cause is local and unambiguous.
    ladder:
      - action: same_worker_repair
        max: 1
      - action: sibling_in_same_family
      - action: alias
        alias: routine_worker
    forbidden: [sol_xhigh]

  localized_logic:
    description: >
      Implementation mistake confined to the diff. Switch family to avoid
      correlated repeat mistakes.
    ladder:
      - action: cross_family
        prefer:
          deepseek: [luna_high, kimi_code]
          gpt: [kimi_code, deepseek_flash]
          kimi: [luna_high, terra_high]
          glm: [luna_high, kimi_code]
      - action: alias
        alias: complex_worker
    forbidden: [sol_xhigh]

  missing_repository_context:
    description: >
      Worker did not have enough of the repository in view. Do NOT retry with
      "more thinking" - retry with more context.
    ladder:
      - action: alias
        alias: large_context
      - action: rebuild_context_packet
        then_alias: complex_worker
    forbidden: []

  architecture_or_integration:
    description: >
      Cross-cutting or design-level failure. Throwing worker compute at it is waste.
    ladder:
      - action: worker
        worker: terra_high
      - action: worker
        worker: terra_xhigh
      - action: worker
        worker: sol_xhigh
        requires: high_risk_justification
    forbidden: []

  flaky_or_environmental:
    description: CI infrastructure, network, or nondeterministic test.
    ladder:
      - action: rerun_ci
        max: 2
      - action: quarantine_and_report
    forbidden: []

  requirement_ambiguity:
    description: >
      The issue does not determine the correct behaviour. No model may decide
      a product question.
    ladder:
      - action: BLOCKED_HUMAN
    forbidden: [ALL]

  unknown:
    ladder:
      - action: alias
        alias: complex_worker
      - action: BLOCKED_HUMAN

# Review findings never go back to the original author for adjudication.
review_remediation:
  orchestrator_validates_finding: true
  remediation_worker: different_from_original_author
  reviewer_rechecks: true
  blocking_severities: [critical, high]
  non_blocking_become_pr_comments: true

# Conditions that pause execution and ask you a question.
human_escalation_triggers:
  - unresolved_requirement
  - contradictory_authoritative_docs
  - undeclared_dependency_requiring_dag_change
  - retry_budget_exhausted
  - destructive_operation_requested
  - repository_resolution_ambiguous
