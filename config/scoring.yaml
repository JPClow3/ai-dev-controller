weights:
  acceptance_coverage: 0.35
  first_pass_ci: 0.25
  reviewer_defects: 0.15
  unnecessary_churn: 0.10
  resource_cost: 0.10
  wall_clock: 0.05

promotion:
  low_risk:
    automatic: true
    minimum_challenger_samples: 12
    minimum_score_advantage: 0.08
    minimum_success_rate: 0.70
  medium_risk:
    automatic: false
    propose_after_samples: 12
  high_risk:
    automatic: false
    experimentation: false

champion_challenger:
  exploration_rate: 0.15
  eligible_risk:
    - low
  # Never run champion and challenger on the same issue; sample over time.
  dual_run: false

acceptance:
  verdicts: [PASS, PARTIAL, FAIL, UNCERTAIN]
  points:
    PASS: 1.0
    PARTIAL: 0.5
    FAIL: 0.0
    UNCERTAIN: 0.25
  require_evidence: true

first_pass_ci:
  penalty_per_remediation_cycle: 0.35

reviewer_defects:
  severity_penalty:
    critical: 1.00
    high: 0.55
    medium: 0.20
    low: 0.05

churn:
  penalty:
    unrelated_refactor: 0.30
    unnecessary_dependency: 0.30
    reformatting_unrelated_files: 0.20
    duplicate_abstraction: 0.25
    excessive_generated_code: 0.20

wall_clock:
  target_minutes_by_role:
    issue_cleanup: 4
    routine_mechanical: 8
    routine_bugfix: 15
    multi_file_feature: 40
    orchestrator: 25
  penalty_per_target_multiple: 0.25
