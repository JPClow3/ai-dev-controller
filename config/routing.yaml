# Worker identity is model + reasoning effort + harness. Every alias below is
# a separate competitor in routing statistics: luna_high and luna_xhigh are
# not the same worker.
#
# `profile` is the Codex profile name in ~/.codex/config.toml. Ollama Cloud
# runs behind the same Codex harness so all families are compared through one
# interface rather than across two different agent harnesses.
aliases:
  deepseek_flash:
    family: deepseek
    harness: codex
    provider: ollama
    profile: ollama-deepseek
    context_window: 1000000
    usage_class: medium
  kimi_code:
    family: kimi
    harness: codex
    provider: ollama
    profile: ollama-kimi
    context_window: 256000
    usage_class: high
  glm_5_2:
    family: glm
    harness: codex
    provider: ollama
    profile: ollama-glm
    context_window: 976000
    usage_class: high
  luna_low:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-low
  luna_high:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-high
  luna_xhigh:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-xhigh
  terra_high:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-terra-high
  terra_xhigh:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-terra-xhigh
  sol_xhigh:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-sol-xhigh

# Starting hypothesis, not permanent truth. Promotion rules in scoring.yaml
# rewrite the per-repository champion as evidence accumulates.
roles:
  issue_cleanup:
    champion: deepseek_flash
    challengers: [luna_low]
  requirement_cleanup:
    champion: luna_low
    challengers: [glm_5_2]
  routine_mechanical:
    champion: deepseek_flash
    challengers: [luna_high]
  routine_behavior:
    champion: luna_high
    challengers: [deepseek_flash, kimi_code]
  routine_bugfix:
    champion: luna_high
    challengers: [kimi_code]
  unit_tests:
    champion: deepseek_flash
    challengers: [luna_high, kimi_code]
  multi_file_feature:
    champion: kimi_code
    challengers: [luna_high]
  large_context:
    champion: glm_5_2
    challengers: [terra_high]
  orchestrator:
    champion: terra_high
    challengers: [glm_5_2]
  high_risk:
    champion: sol_xhigh
    challengers: []

# Risk gates. Experimentation only ever happens on low-risk work.
risk_gates:
  low:
    allow_challenger: true
  medium:
    allow_challenger: false
  high:
    allow_challenger: false
    locked_role: high_risk

# Reviewer selection is by authorship, not a rigid rule.
review:
  integration:
    strategy: opposite_family_from_authors
  final:
    strategy: least_involved_family
  escalation: sol_xhigh

# Subscriptions are flat-ish, so the router tracks scarcity rather than
# pretending each token costs API dollars.
#   utility = expected_score - scarcity_penalty - latency_penalty
pressure:
  states: [LOW, NORMAL, HIGH, EXHAUSTED]
  default: NORMAL
  scarcity_multiplier:
    LOW: 0.6
    NORMAL: 1.0
    HIGH: 2.0
    EXHAUSTED: 999.0
  utility_weights:
    expected_score: 1.0
    scarcity_penalty: 0.25
    latency_penalty: 0.05
  sources:
    - orca_account_rate_limits
    - cli_rate_limit_headers
    - request_failure_rate
    - manual_override
