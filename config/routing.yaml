# Worker identity is model + reasoning effort + harness. Every alias below is
# a separate competitor in routing statistics: luna_high and luna_xhigh are
# not the same worker.
#
# `profile` is the Codex profile name in ~/.codex/<profile>.config.toml.
# All aliases run on OpenAI models through the ChatGPT subscription; the
# former Ollama Cloud aliases were removed. Challengers keep the same model
# and vary only reasoning effort, so the experiment measures thinking depth
# rather than changing two variables at once.
aliases:
  luna_low:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-low
    model: gpt-5.6-luna
    reasoning_effort: low
  luna_medium:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-medium
    model: gpt-5.6-luna
    reasoning_effort: medium
  luna_high:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-high
    model: gpt-5.6-luna
    reasoning_effort: high
  luna_xhigh:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-xhigh
    model: gpt-5.6-luna
    reasoning_effort: xhigh
  terra_medium:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-terra-medium
    model: gpt-5.6-terra
    reasoning_effort: medium
  terra_high:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-terra-high
    model: gpt-5.6-terra
    reasoning_effort: high
  terra_xhigh:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-terra-xhigh
    model: gpt-5.6-terra
    reasoning_effort: xhigh
  sol_medium:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-sol-medium
    model: gpt-5.6-sol
    reasoning_effort: medium
  sol_high:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-sol-high
    model: gpt-5.6-sol
    reasoning_effort: high
  sol_xhigh:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-sol-xhigh
    model: gpt-5.6-sol
    reasoning_effort: xhigh
  # Same models reachable through the Command Code subscription. These are
  # separate competitors in routing stats: the account, quota and transport
  # differ even when the model tag is identical.
  luna_cc:
    family: openai
    harness: command-code
    provider: commandcode
    model: gpt-5.6-luna
    reasoning_effort: medium
  terra_cc:
    family: openai
    harness: command-code
    provider: commandcode
    model: gpt-5.6-terra
    reasoning_effort: medium
  sol_cc:
    family: openai
    harness: command-code
    provider: commandcode
    model: gpt-5.6-sol
    reasoning_effort: high
  glm_cc:
    family: zai
    harness: command-code
    provider: commandcode
    model: zai-org/GLM-5.2
    reasoning_effort: high
  kimi_cc:
    family: moonshot
    harness: command-code
    provider: commandcode
    model: moonshotai/Kimi-K3
  deepseek_cc:
    family: deepseek
    harness: command-code
    provider: commandcode
    model: deepseek/deepseek-v4-pro
  # Z.AI directly over its OpenAI-compatible HTTP API. This is the first
  # non-CLI transport; it proves the generic HTTP path for future providers.
  glm_zai:
    family: zai
    harness: http
    provider: zai
    model: glm-5.1
    reasoning_effort: high
  glm_zai_fast:
    family: zai
    harness: http
    provider: zai
    model: glm-5-turbo
    reasoning_effort: high

# Starting hypothesis, not permanent truth. Promotion rules in scoring.yaml
# rewrite the per-repository champion as evidence accumulates.
#
# Cost policy: routing is deliberately Luna-heavy. Luna handles curation,
# planning, and every implementation role including large multi-file work at
# xhigh effort; Terra aliases stay declared for explicit AI_DEV_FORCE_ALIAS
# pilots but no role defaults to them. Sol is reserved for orchestration
# review and high-risk work, because an independent final judgement is the
# one place the extra tier buys something Luna cannot.
roles:
  issue_cleanup:
    champion: luna_medium
    challengers: [luna_low, luna_high, luna_cc]
  requirement_cleanup:
    champion: luna_medium
    challengers: [luna_low, luna_high, luna_cc]
  planning:
    champion: luna_high
    challengers: [luna_medium, luna_xhigh, luna_cc, glm_cc]
  routine_mechanical:
    champion: luna_high
    challengers: [luna_medium, luna_xhigh, luna_cc]
  routine_behavior:
    champion: luna_high
    challengers: [luna_medium, luna_xhigh, luna_cc]
  routine_bugfix:
    champion: luna_high
    challengers: [luna_medium, luna_xhigh, luna_cc]
  unit_tests:
    champion: luna_high
    challengers: [luna_medium, luna_xhigh, luna_cc]
  multi_file_feature:
    champion: luna_xhigh
    challengers: [luna_high, luna_medium, luna_cc]
  large_context:
    champion: luna_xhigh
    challengers: [luna_high, luna_cc, glm_cc, glm_zai]
  orchestrator:
    champion: sol_high
    challengers: [sol_medium, sol_xhigh]
  high_risk:
    champion: sol_xhigh
    challengers: [sol_cc, glm_zai]

# Risk gates. Experimentation only ever happens on low-risk work.
risk_gates:
  low:
    allow_challenger: true
  medium:
    allow_challenger: false
  high:
    allow_challenger: false
    locked_role: high_risk

# Final review uses the Sol tier, kept separate from Luna implementation.
review:
  integration:
    strategy: opposite_family_from_authors
  final:
    strategy: least_involved_family
  escalation: sol_xhigh

# Subscriptions are flat-ish, so the router tracks scarcity rather than
# pretending each token costs API dollars — but tokens are still the budget a
# subscription actually spends, so the utility penalises aliases that burn
# them: verbosity is routed against, not just rate limits.
#   utility = expected_score - scarcity_penalty - latency_penalty - token_penalty
pressure:
  states: [LOW, NORMAL, HIGH, EXHAUSTED]
  default: NORMAL
  scarcity_multiplier:
    LOW: 0.6
    NORMAL: 1.0
    HIGH: 2.0
    EXHAUSTED: 999.0
  utility_weights:
    expected_score: 1.0
    scarcity_penalty: 0.25
    latency_penalty: 0.05
    # Subtracted at up to this value as an alias's average output tokens
    # approach TOKEN_SATURATION_TOKENS (see src/routing/selector.ts).
    token_penalty: 0.2
  sources:
    - orca_account_rate_limits
    - cli_rate_limit_headers
    - request_failure_rate
    - recorded_token_usage
    - manual_override
