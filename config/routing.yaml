# Worker identity is model + reasoning effort + harness. Every alias below is
# a separate competitor in routing statistics: luna_high and luna_xhigh are
# not the same worker.
#
# `profile` is the Codex profile name in ~/.codex/<profile>.config.toml.
# Production roles use OpenAI models. Challengers keep the same model and vary
# only reasoning effort, so the experiment measures thinking depth rather than
# changing two variables at once.
aliases:
  deepseek_flash:
    family: deepseek
    harness: codex
    provider: ollama
    profile: ollama-deepseek
    context_window: 1000000
    usage_class: medium
  kimi_code:
    family: kimi
    harness: codex
    provider: ollama
    profile: ollama-kimi
    context_window: 256000
    usage_class: high
  glm_5_2:
    family: glm
    harness: codex
    provider: ollama
    profile: ollama-glm
    context_window: 976000
    usage_class: high
  luna_low:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-low
    model: gpt-5.6-luna
    reasoning_effort: low
  luna_medium:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-medium
    model: gpt-5.6-luna
    reasoning_effort: medium
  luna_high:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-high
    model: gpt-5.6-luna
    reasoning_effort: high
  luna_xhigh:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-luna-xhigh
    model: gpt-5.6-luna
    reasoning_effort: xhigh
  terra_medium:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-terra-medium
    model: gpt-5.6-terra
    reasoning_effort: medium
  terra_high:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-terra-high
    model: gpt-5.6-terra
    reasoning_effort: high
  terra_xhigh:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-terra-xhigh
    model: gpt-5.6-terra
    reasoning_effort: xhigh
  sol_medium:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-sol-medium
    model: gpt-5.6-sol
    reasoning_effort: medium
  sol_high:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-sol-high
    model: gpt-5.6-sol
    reasoning_effort: high
  sol_xhigh:
    family: openai
    harness: codex
    provider: chatgpt
    profile: gpt-sol-xhigh
    model: gpt-5.6-sol
    reasoning_effort: xhigh

  # Local smoke-test worker. Not referenced by any role, so it never gets
  # routed real work - it exists so the invocation path (HTTP transport, JSON
  # extraction, schema validation, retry) can be exercised without a paid
  # Ollama Cloud subscription or Codex quota.
  local_smoke:
    family: glm
    harness: ollama-http
    provider: ollama_local
    profile: ollama-local
    model: qwen2.5-coder:7b
    context_window: 32768
    usage_class: low

  # Locally pulled model usable as a real worker through the Codex harness.
  # Not referenced by any role, so it is never routed automatically - select it
  # explicitly with AI_DEV_FORCE_ALIAS for a pilot on a known model.
  local_worker:
    family: glm
    harness: codex
    provider: ollama_local
    profile: ollama-local
    model: qwen2.5-coder:7b
    context_window: 32768
    usage_class: low

# Starting hypothesis, not permanent truth. Promotion rules in scoring.yaml
# rewrite the per-repository champion as evidence accumulates.
roles:
  issue_cleanup:
    champion: luna_medium
    challengers: [luna_low, luna_high]
  requirement_cleanup:
    champion: luna_medium
    challengers: [luna_low, luna_high]
  routine_mechanical:
    champion: luna_high
    challengers: [luna_medium, luna_xhigh]
  routine_behavior:
    champion: luna_high
    challengers: [luna_medium, luna_xhigh]
  routine_bugfix:
    champion: luna_high
    challengers: [luna_medium, luna_xhigh]
  unit_tests:
    champion: luna_high
    challengers: [luna_medium, luna_xhigh]
  multi_file_feature:
    champion: terra_high
    challengers: [terra_medium, terra_xhigh]
  large_context:
    champion: terra_high
    challengers: [terra_medium, terra_xhigh]
  orchestrator:
    champion: sol_high
    challengers: [sol_medium, sol_xhigh]
  high_risk:
    champion: sol_xhigh
    challengers: []

# Risk gates. Experimentation only ever happens on low-risk work.
risk_gates:
  low:
    allow_challenger: true
  medium:
    allow_challenger: false
  high:
    allow_challenger: false
    locked_role: high_risk

# Final review uses the Sol tier, kept separate from Luna/Terra implementation.
review:
  integration:
    strategy: opposite_family_from_authors
  final:
    strategy: least_involved_family
  escalation: sol_xhigh

# Subscriptions are flat-ish, so the router tracks scarcity rather than
# pretending each token costs API dollars.
#   utility = expected_score - scarcity_penalty - latency_penalty
pressure:
  states: [LOW, NORMAL, HIGH, EXHAUSTED]
  default: NORMAL
  scarcity_multiplier:
    LOW: 0.6
    NORMAL: 1.0
    HIGH: 2.0
    EXHAUSTED: 999.0
  utility_weights:
    expected_score: 1.0
    scarcity_penalty: 0.25
    latency_penalty: 0.05
  sources:
    - orca_account_rate_limits
    - cli_rate_limit_headers
    - request_failure_rate
    - manual_override
