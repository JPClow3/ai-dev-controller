poll_interval_seconds: 45

concurrency:
  active_issues: 4
  workers_per_issue: 3
  global_agents: 7
  gpt_heavy_agents: 2
  gpt_luna_workers: 3
  ollama_workers: 3
  agents_per_repository: 5

linear:
  labels:
    curate: ai-curate
    needs_context: ai-needs-context
    ready: ai-ready
    running: ai-running
    blocked: ai-blocked
    reviewing: ai-reviewing
    pr_open: ai-pr-open
  # Only explicit, human-approved blockedBy relations are trusted.
  trust_inferred_dependencies: false

git:
  branch_prefix: "ai/"
  bootstrap_branch: ai/bootstrap-project-knowledge
  always_fresh_base: true

github:
  draft_prs: true
  auto_merge: false
  ci_is_authoritative: true

knowledge:
  # Soft gate: work proceeds while the bootstrap PR is open.
  allow_unverified_execution: true
  max_file_bytes: 262144
  scan_globs:
    - "**/AGENTS.md"
    - "**/CLAUDE.md"
    - "**/GEMINI.md"
    - "**/README*.md"
    - "**/CONTRIBUTING*.md"
    - "docs/**/*.md"
    - "design/**/*.md"
    - "architecture/**/*.md"
    - "specs/**/*.md"
    - ".ai/**/*.md"
    - ".cursor/**/*.md"
    - "*.md"
  exclude_globs:
    - "node_modules/**"
    - "vendor/**"
    - "dist/**"
    - "build/**"
    - "generated/**"
    - "docs/archive/**"
    - ".git/**"

orca:
  bin: orca
  child_worktrees: true

safety:
  # Workers may WRITE code that does these. They may never EXECUTE them.
  forbidden_operations:
    - production_database_mutation
    - production_deployment
    - remote_resource_deletion
    - production_secret_rotation
    - force_push_protected_branch
    - pr_merge
    - branch_protection_change
    - destructive_cloud_operation

paths:
  database: ./data/controller.db
  registry: ./projects/registry.yaml
